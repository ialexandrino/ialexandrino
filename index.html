                <p class="hero-lead" data-i18n="hero.lead"></p>
                <ul class="reach">
                    <li><a href="https://www.linkedin.com/in/ivanalexandrino/" target="_blank" rel="noopener">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4" /><path d="M8 10.5V16M8 7.8v.01M12 16v-3.2c0-1.2.7-2 1.7-2s1.5.8 1.5 2V16" stroke-linecap="round" /></svg>
                        LinkedIn</a></li>
                    <li><a href="https://github.com/ialexandrino" target="_blank" rel="noopener">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M9 19c-4 1.5-4-2-6-2.5m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1-.3-3.4 1.3a11.6 11.6 0 0 0-6 0C6.8 3.3 5.8 3.6 5.8 3.6a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4.4 10c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V22" stroke-linecap="round" stroke-linejoin="round" /></svg>

                    <li><a href="mailto:ivan.alexandrino@outlook.com">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3" /><path d="m4 7 8 6 8-6" stroke-linecap="round" stroke-linejoin="round" /></svg>
                        E-mail</a></li>
                </ul>
                <a href="#about" class="btn btn-ghost"><span data-i18n="hero.cta"></span> ↓</a>
            </div>

            <!-- Reference HA architecture: edge → load balancer → 2 AZs (app, cache, db) -->
            <figure class="hero-visual">
                <svg class="hero-diagram" id="hero-diagram" viewBox="0 0 480 660" aria-hidden="true">
                    <defs>
                        <path id="route-a" d="M240 33 V193 L135 300 V500" />
                        <path id="route-b" d="M240 33 V193 L345 300 V500" />
                    </defs>
                    <g class="d-zone">
                        <rect x="20" y="150" width="440" height="470" rx="14" />
                        <rect x="40" y="250" width="190" height="350" rx="10" />
                        <rect x="250" y="250" width="190" height="350" rx="10" />
                    </g>
                    <g class="d-zone-label">
                        <text x="36" y="172">vpc</text>
                        <text x="56" y="272">az-a</text>
                        <text x="266" y="272">az-b</text>
                    </g>
                    <g class="d-link">
                        <use href="#route-a" />
                        <use href="#route-b" />
                        <path d="M205 500 H275" />
                    </g>
                    <g class="d-packets">
                        <circle r="3.5"><animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#route-a" /></animateMotion></circle>
                        <circle r="3.5"><animateMotion dur="3.2s" begin="-1.6s" repeatCount="indefinite"><mpath href="#route-b" /></animateMotion></circle>
                        <circle r="3.5"><animateMotion dur="3.2s" begin="-0.8s" repeatCount="indefinite"><mpath href="#route-b" /></animateMotion></circle>
                        <circle r="3.5"><animateMotion dur="3.2s" begin="-2.4s" repeatCount="indefinite"><mpath href="#route-a" /></animateMotion></circle>
                    </g>
                    <g class="d-node">
                        <rect x="180" y="15" width="120" height="36" rx="10" />
                        <rect x="150" y="85" width="180" height="36" rx="10" />
                        <rect x="160" y="175" width="160" height="36" rx="10" />
                        <rect x="65" y="280" width="140" height="40" rx="10" />
                        <rect x="275" y="280" width="140" height="40" rx="10" />
                        <rect x="65" y="380" width="140" height="40" rx="10" />
                        <rect x="275" y="380" width="140" height="40" rx="10" />
                        <rect x="65" y="480" width="140" height="40" rx="10" />
                        <rect x="275" y="480" width="140" height="40" rx="10" />
                    </g>
                    <g class="d-label">
                        <text x="240" y="37">users</text>
                        <text x="240" y="107">dns · cdn · waf</text>
                        <text x="240" y="197">load balancer</text>
                        <text x="135" y="304">app · k8s</text>
                        <text x="345" y="304">app · k8s</text>
                        <text x="135" y="404">cache</text>
                        <text x="345" y="404">cache</text>
                        <text x="135" y="504">db primary</text>
                        <text x="345" y="504">db replica</text>
                    </g>
                    <g class="d-zone-label">
                        <text x="240" y="492" text-anchor="middle">sync</text>
                        <text x="56" y="588">auto scaling</text>
                        <text x="266" y="588">auto scaling</text>
                    </g>
                </svg>
                <figcaption data-i18n="hero.caption"></figcaption>
            </figure>
